:root {
  --bg: #000000;                            /* the cabinet */
  --sheet: #15121e;                         /* cards over the arena, the sheet */
  --surface: #100d17;                       /* panels and grouped rows on a page */
  --surface-2: #252034;                     /* the grey key: round buttons, plain buttons, segmented controls */
  --surface-3: #3a3250;                     /* the selected segment */
  --key-edge: #050309;                      /* the grey key's edge */
  --band: #1b1727;                          /* marquee bands and raised panels */
  --line: rgba(255, 255, 255, 0.08);
  --hair: rgba(255, 255, 255, 0.07);        /* the hairline round every panel, so its edge is crisp on the black page */
  --track: rgba(255, 255, 255, 0.1);        /* an unlit meter segment */
  --label: #f6f4fc;
  --label-2: rgba(231, 226, 248, 0.62);
  --label-3: rgba(231, 226, 248, 0.36);
  --accent: #9945ff; --accent-edge: #5a1fb8;  /* Solana purple: what you press and what's picked */
  --accent-ink: #ffffff;                    /* text on purple */
  --accent-hi: #b98cff;                     /* purple text on black (links, the picked mode) */
  --accent-soft: rgba(153, 69, 255, 0.18);  /* a purple tint behind purple text */
  --accent-tint: #1a1130;                   /* the picked key's fill: purple-black, flat */
  --green: #14f195; --green-edge: #0a8f58;  /* Solana green: money and progress */
  --green-ink: #00170c;                     /* text on green */
  --green-soft: rgba(20, 241, 149, 0.14);
  --red: #ff5c7a;                           /* errors only */
  --gold: var(--green);                     /* what was gold (XP, trophies, meters) is Solana green */
  --yellow: var(--green);
  --sep: var(--line);
  --glass: rgba(16, 13, 23, 0.86);          /* capsules over the game */
  --glass-line: rgba(255, 255, 255, 0.08);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --font-round: "SD Display", ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  --font-title: var(--font-round);
  --edge: 4px;                              /* how far a big key stands up */
  --spring: cubic-bezier(.34, 1.56, .64, 1); /* a small overshoot for presses and pops */
  /* the flame's colours (the game sets these from its one flame: Solana purple, green at full heat) */
  --heat: 153, 69, 255; --heat-hi: 206, 164, 255; --heat-edge: 88, 24, 196; --heat-text: 228, 205, 255;
  --nova: 20, 241, 149; --nova-hi: 160, 255, 214; --nova-edge: 0, 150, 98; --nova-text: 202, 255, 233;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --tab-h: 52px;   /* the docked tab bar, above the home indicator */
  --above-tabs: calc(var(--safe-b) + var(--tab-h) + 12px);
  --top: calc(var(--safe-t) + 56px);   /* where large titles sit, under the slim top row */
  --col: 430px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--label);
  font-family: var(--font); font-size: 15px;
  overflow: hidden; overscroll-behavior: none; touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
canvas#game { position: fixed; inset: 0; display: block; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-round); font-variant-numeric: tabular-nums; }
.unit { margin-left: 0.3em; font-family: var(--font); font-size: 0.6em; font-weight: 600; letter-spacing: 0.02em; color: var(--label-2); }
.sol-ico { display: inline-flex; align-items: center; flex: none; }
.sol-ico:empty { display: none; }
.sol-ico img { display: block; width: 0.92em; height: 0.92em; margin-right: 0.34em; object-fit: contain; }

/* ---------- capsules ---------- */
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: saturate(160%) blur(18px); backdrop-filter: saturate(160%) blur(18px);
  box-shadow: inset 0 0 0 1px var(--glass-line);
}
/* During a run the capsules, the streak meter and goal notices sit over a canvas that redraws every frame, so a
   blur behind them would have to be recomputed every frame too, which costs phones frames. Over the dark court a
   slightly denser fill looks the same. */
.hud-play .glass, .hud-play .streak, .hud-play #notice { -webkit-backdrop-filter: none; backdrop-filter: none; }
.hud-play .glass, .hud-play .streak { background: rgba(10, 7, 16, 0.72); }
.hud-play #notice { background: rgba(21, 18, 30, 0.96); }
.cap {
  pointer-events: auto;
  display: inline-flex; align-items: center; gap: 5px;
  height: 38px; padding: 0 14px; border-radius: 19px;
  font-weight: 600; font-size: 15px; color: var(--label);
  font-variant-numeric: tabular-nums; white-space: nowrap;
  transition: background 0.2s, transform 0.12s;
}
.cap:active { transform: scale(0.95); }
.cap.icon { width: 40px; height: 40px; border-radius: 20px; padding: 0; justify-content: center; color: rgba(255, 255, 255, 0.86); }
.cap svg { width: 18px; height: 18px; }
.cap .num { font-weight: 700; font-size: 15px; }
.cap .tag { margin-left: 4px; padding: 2px 6px; border-radius: 6px; background: rgba(255, 255, 255, 0.1); font-size: 11px; font-weight: 600; color: var(--label-2); }
.hud-lobby #balBtn { background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; } /* on the black page, a panel */

/* ---------- HUD ---------- */
#hud {
  position: fixed; left: 50%; top: 0; z-index: 5; transform: translateX(-50%);
  width: min(100%, max(var(--col, 100%), 400px)); /* over the play column on wide screens */
  padding: calc(var(--safe-t) + 10px) 14px 0;
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: start;
  pointer-events: none;
}
/* left: pause, then the level and its rings, then the streak; centre: multiplier and pot; right: sound */
.hud-left { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.hud-mid { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; }
.hud-right { display: flex; justify-content: flex-end; gap: 8px; }
.hud-left .lvl { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding-left: 3px; font-family: var(--font-round); font-size: 12.5px; font-weight: 700; color: rgba(255, 255, 255, 0.86); font-variant-numeric: tabular-nums; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7); white-space: nowrap; }
.segbar { display: grid; grid-template-columns: repeat(6, 12px); gap: 3px; }
.seg-i { height: 5px; border-radius: 1px; background: rgba(255, 255, 255, 0.16); transition: background 0.25s, transform 0.25s; }
.seg-i.on { background: rgba(255, 255, 255, 0.5); }
.seg-i.on.sw { background: #ffffff; }
.seg-i.cp { background: rgba(20, 241, 149, 0.3); }
.seg-i.cp.on { background: var(--gold); }
.seg-i.now { transform: scaleY(1.5); }
.score {
  font-family: var(--font-round); font-weight: 700; font-size: 40px; line-height: 1; letter-spacing: -0.01em; font-variant-numeric: tabular-nums;
  color: #ffffff; text-shadow: 0 1px 12px rgba(0, 0, 0, 0.45);
  transition: color 0.35s, text-shadow 0.35s; white-space: nowrap;
}
.score.hot { color: rgb(var(--heat-text)); }
.score.nova { color: rgb(var(--nova-text)); }
/* the multiplier's bump, the streak meter's pump, the pot's +gain and the callouts are played from game.js with the
   Web Animations API (hudAnim), so restarting one never forces a layout mid-frame */
#potCap { margin-top: 5px; font-family: var(--font-round); font-weight: 700; font-size: 14px; color: rgba(255, 255, 255, 0.82); font-variant-numeric: tabular-nums; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7); white-space: nowrap; }
#potCap .unit { color: var(--label-3); }
.hud-lobby #hud { z-index: 12; display: flex; justify-content: flex-end; padding-left: 16px; padding-right: 16px; }
.hud-lobby .hud-left { display: none; }
.hud-play .lobby-only { display: none !important; }
.hud-lobby .play-only { display: none !important; }

/* ---------- prompts ---------- */
#prompt {
  position: fixed; left: 50%; top: 63%; transform: translate(-50%, -50%); z-index: 4;
  pointer-events: none; text-align: center; opacity: 0; transition: opacity 0.25s;
}
#prompt.show { opacity: 1; }
#prompt .t { font-family: var(--font-title); font-weight: 700; font-size: 26px; text-shadow: 0 1px 12px rgba(0, 0, 0, 0.5); }
#prompt .s { margin-top: 4px; font-size: 14px; color: var(--label-2); }
#prompt .s:empty { display: none; }
#prompt .ring { position: relative; width: 46px; height: 46px; margin: 0 auto 12px; }  /* a touch point that presses, with a ripple going out */
#prompt .ring::before { content: ''; position: absolute; inset: 16px; border-radius: 50%; background: #fff; animation: tapDot 1.3s ease-in-out infinite; }
#prompt .ring::after { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, 0.85); animation: tapHint 1.3s ease-out infinite; }
@keyframes tapHint { 0% { transform: scale(0.36); opacity: 0.95; } 100% { transform: scale(1.35); opacity: 0; } }
@keyframes tapDot { 0%, 100% { transform: scale(1); } 9% { transform: scale(0.7); } 26% { transform: scale(1); } }
#banner {
  position: fixed; left: 0; right: 0; top: calc(var(--safe-t) + 21%); z-index: 4; pointer-events: none; text-align: center;
  opacity: 0; transform: translateY(8px) scale(0.98); transition: opacity 0.3s, transform 0.35s cubic-bezier(.2, .9, .2, 1);
}
#banner.show { opacity: 1; transform: none; }
#banner .b1 { font-family: var(--font-title); font-weight: 700; font-size: 34px; line-height: 1.1; text-shadow: 0 1px 14px rgba(0, 0, 0, 0.5); }
#banner .b2 { margin-top: 8px; font-size: 14px; font-weight: 550; color: var(--label-2); }
#banner .b2:empty { display: none; }

/* ---------- sheets & cards ---------- */
.sheet, .card, .panel {
  position: fixed; z-index: 10; left: 50%;
  width: min(430px, calc(100% - 16px));
  background: var(--sheet);
  box-shadow: inset 0 0 0 1px var(--line), 0 24px 60px rgba(0, 0, 0, 0.6);
  border-radius: 26px;
  transform: translate(-50%, 0);
  transition: transform 0.45s cubic-bezier(.2, .9, .2, 1), opacity 0.25s;
  touch-action: manipulation;
}
.sheet { bottom: calc(var(--safe-b) + 8px); padding: 16px 16px 8px; }
.sheet.hide { transform: translate(-50%, calc(100% + 40px)); opacity: 0; pointer-events: none; }
.card { top: 50%; transform: translate(-50%, -50%); padding: 24px 18px 14px; text-align: center; }
/* the checkpoint is the gold ring: its card opens under a gold marquee band */
#checkpoint { overflow: hidden; padding-top: 0; }
#checkpoint .kicker { margin: 0 -18px 20px; padding: 11px 16px 10px; background: var(--band); color: var(--label); font-family: var(--font-round); font-size: 13px; font-weight: 700; box-shadow: inset 0 -1px 0 var(--line); }
.card.hide { transform: translate(-50%, -46%) scale(0.97); opacity: 0; pointer-events: none; }
.card:focus { outline: none; }
.card .btn { transition: transform 0.3s var(--spring), box-shadow 0.3s var(--spring), opacity 0.3s; }
.card.arming .btn { pointer-events: none; opacity: 0.4; }  /* decisions arm after a beat, so a flap tap can't press them */


/* the modes: a key each with the most it can win; the picked one stands up and lights purple */
.tiers { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 10px; }
.tiers button {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  height: 62px; margin-bottom: 3px; padding: 0 2px; border-radius: 16px;
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--hair), 0 3px 0 var(--key-edge);
  transition: background 0.25s, transform 0.3s var(--spring), box-shadow 0.3s var(--spring), color 0.25s;
}
.tiers button:active { transform: translateY(2px); box-shadow: inset 0 0 0 1px var(--hair), 0 1px 0 var(--key-edge); transition-duration: 0.06s; }
.tiers .tn { font-size: 12.5px; font-weight: 600; color: var(--label-3); white-space: nowrap; transition: color 0.25s; }
.tiers .tx { font-family: var(--font-round); font-size: 21px; font-weight: 700; line-height: 1.1; color: var(--label-2); white-space: nowrap; font-variant-numeric: tabular-nums; transition: color 0.25s; }
.tiers button[aria-checked="true"] { background: var(--accent-tint); box-shadow: inset 0 0 0 1.5px var(--accent), 0 3px 0 var(--accent-edge); }
.tiers button[aria-checked="true"]:active { box-shadow: inset 0 0 0 1.5px var(--accent), 0 1px 0 var(--accent-edge); }
.tiers button[aria-checked="true"] .tn { color: var(--accent-hi); }
.tiers button[aria-checked="true"] .tx { color: var(--label); }
/* segmented controls (odds tiers, sub-pages) */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 0; padding: 3px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.seg button {
  position: relative; display: flex; align-items: center; justify-content: center;
  height: 32px; padding: 0 2px; border-radius: 9px;
  font-size: 13px; font-weight: 600; color: var(--label-2); white-space: nowrap;
  transition: background 0.2s, color 0.2s;
}
.seg button + button::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 1px; background: var(--line); transition: opacity 0.2s; }
.seg button[aria-checked="true"], .seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--label); }
.seg button[aria-checked="true"]::before, .seg button[aria-checked="true"] + button::before,
.seg button[aria-pressed="true"]::before, .seg button[aria-pressed="true"] + button::before { opacity: 0; }

.foot { margin: 8px 4px 0; font-size: 13px; color: var(--label-2); font-variant-numeric: tabular-nums; }
.foot-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 8px 2px 0 4px; }
.foot-row .foot { margin: 0; min-width: 0; }
.foot-link { flex: none; display: inline-flex; align-items: center; gap: 1px; padding: 4px 0 4px 8px; margin: -4px 0; font-size: 13px; font-weight: 600; color: var(--accent-hi); }
.foot-link svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.foot-link:active { opacity: 0.55; }
.foot b { color: var(--label); font-weight: 650; }
.foot .dim { color: var(--label-3); }

/* grouped rows */
.group { background: var(--surface); border-radius: 18px; overflow: hidden; }
.sheet .group { margin-bottom: 10px; }
.card .group { background: rgba(255, 255, 255, 0.045); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 50px; padding: 0 10px 0 16px; }
.row + .row { box-shadow: inset 0 1px 0 var(--line); }
.row .k { color: var(--label); font-size: 17px; font-weight: 400; }
.row .v { color: var(--label-2); text-align: right; font-variant-numeric: tabular-nums; }
/* the bet: a panel with round minus and plus keys (a 1-2-5 ladder) and the amount big in the middle; what it can win under it */
.bet { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 7px 7px 9px; border-radius: 22px; background: var(--surface); }
.round {
  flex: none; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 23px;
  background: var(--surface-2); color: var(--label); box-shadow: 0 3px 0 var(--key-edge);
  transition: transform 0.25s var(--spring), box-shadow 0.25s var(--spring), background 0.15s, color 0.15s;
}
.round:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--key-edge); background: #2e3441; transition-duration: 0.06s; }
.round[disabled] { color: var(--label-3); pointer-events: none; box-shadow: 0 1px 0 var(--key-edge); transform: translateY(2px); background: #1a1e26; }
.round svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; }
.bet-field { flex: 1; display: flex; align-items: baseline; justify-content: center; min-width: 0; cursor: text; }
.bet-field .unit { margin-left: 6px; font-size: 14px; }
.bet-input { width: 5.4ch; max-width: 100%; height: 40px; border: 0; padding: 0; background: transparent; text-align: center; color: var(--label); font-family: var(--font-round); font-weight: 700; font-size: 27px; font-variant-numeric: tabular-nums; }
.bet-input:focus { outline: none; }
.win { margin: 10px 0 12px; text-align: center; font-size: 15px; color: var(--label-2); }
.win b { font-family: var(--font-round); font-weight: 700; color: var(--label); }

/* keys: every big button stands on a flat darker edge and sinks into it when pressed */
.btn {
  --k-edge: var(--key-edge);
  display: flex; align-items: center; justify-content: center; gap: 7px;
  width: 100%; height: 54px; margin-bottom: var(--edge); border-radius: 16px;
  font-family: var(--font-round); font-size: 17px; font-weight: 700;
  box-shadow: 0 var(--edge) 0 var(--k-edge);
  transition: transform 0.3s var(--spring), box-shadow 0.3s var(--spring), opacity 0.15s;
}
.btn:active { transform: translateY(calc(var(--edge) - 1px)); box-shadow: 0 1px 0 var(--k-edge); transition-duration: 0.06s; }
.btn-primary { --k-edge: var(--accent-edge); background: var(--accent); color: var(--accent-ink); }
.btn-green { --k-edge: var(--green-edge); background: var(--green); color: var(--green-ink); }
.btn-plain { background: var(--surface-2); color: var(--label); }
.btn[disabled] { opacity: 0.4; pointer-events: none; }
.btn .num { font-weight: 700; }
/* a free practice run, under the Play key: a quiet link, so Play stays the one button */
.practice-link { display: block; margin: 2px auto 0; padding: 6px 14px; font-size: 14px; font-weight: 600; color: var(--accent-hi); }
.practice-link:active { opacity: 0.55; }
/* practice: the cards show a multiplier, not SOL */
#checkpoint.practice .big .unit, #result.practice .big .unit { display: none; }
#result.practice #shareBtn { display: none; }
#result.practice .pair { grid-template-columns: minmax(0, 1fr); }
#potCap.practice .unit { display: none; }
/* the quick tour: three short steps over the lobby, ending in a free practice run */
#tour { z-index: 15; padding: 28px 20px 10px; }
.tour-ic { display: grid; place-items: center; width: 60px; height: 60px; margin: 0 auto 16px; border-radius: 18px; background: var(--surface-2); color: var(--label); box-shadow: 0 4px 0 var(--key-edge); }
.tour-ic svg { width: 32px; height: 32px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#tour .card-title { margin-bottom: 8px; font-size: 23px; text-wrap: balance; }
.tour-tx { max-width: 30ch; min-height: 4.4em; margin: 0 auto; font-size: 16px; line-height: 1.45; color: var(--label-2); text-wrap: pretty; }
.tour-dots { display: flex; justify-content: center; gap: 4px; margin: 18px 0 20px; } /* a lit meter: how far through the tour */
.tour-dots i { width: 22px; height: 6px; border-radius: 1px; background: var(--track); transition: background 0.25s; }
.tour-dots i.on { background: var(--green); }
.tour-skip { display: block; margin: 2px auto 0; padding: 10px 18px; font-size: 15px; font-weight: 600; color: var(--label-2); }
.tour-skip:active { opacity: 0.55; }
.how-tour { margin-top: 18px; }
.vtitle + .how-tour + .how { margin-top: 14px; }
.err { min-height: 4px; margin: 4px 0 0; font-size: 13px; color: var(--red); text-align: center; }
.err:empty { margin: 0; }
.err .link { color: var(--accent-hi); font-weight: 650; font-size: 13px; padding: 2px 0; }

/* checkpoint & result */
.kicker { font-size: 13px; font-weight: 600; color: var(--label-2); font-variant-numeric: tabular-nums; }
.card-title { margin: 0 0 12px; font-family: var(--font-title); font-weight: 700; font-size: 20px; line-height: 1.2; }
.big { font-family: var(--font-round); font-weight: 700; font-size: 52px; line-height: 1; letter-spacing: -0.01em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.big .unit { margin-left: 0.22em; font-size: 0.3em; font-weight: 600; letter-spacing: 0; color: var(--label-3); vertical-align: 0.3em; }
.big .sol-ico { vertical-align: 0.08em; }
.big .sol-ico img { width: 0.5em; height: 0.5em; margin-right: 0.12em; }
.big.win .unit, .big.loss .unit { color: inherit; opacity: 0.6; }
.big.win { color: var(--green); }
.big.loss { color: var(--label-2); } /* a loss reads in grey: no red in Solana's palette */
.under { display: inline-block; margin-top: 12px; padding: 5px 12px; border-radius: 9px; background: var(--green-soft); font-family: var(--font-round); font-weight: 700; font-size: 14px; color: var(--green); font-variant-numeric: tabular-nums; }
.under.flat { background: var(--surface-2); color: var(--label-2); }
.under.muted { padding: 0; background: none; font-family: var(--font); color: var(--label-2); font-weight: 500; font-size: 15px; letter-spacing: 0; }
.actions { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.actions .btn { height: 58px; flex-direction: column; gap: 2px; line-height: 1.15; }
.actions .btn small { font-family: var(--font); font-size: 12.5px; font-weight: 600; opacity: 0.66; font-variant-numeric: tabular-nums; }
.stack { display: grid; gap: 8px; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.btn svg { width: 18px; height: 18px; flex: none; margin-top: -2px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 20px 0 16px; padding: 12px 0 11px; border-radius: 18px; background: var(--surface); }
.card .tiles { background: rgba(255, 255, 255, 0.045); }
.tiles div { padding: 0 4px; }
.tiles div + div { box-shadow: inset 1px 0 0 var(--line); }
.tiles b { display: block; font-family: var(--font-round); font-weight: 700; font-size: 21px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.tiles span { font-size: 12px; font-weight: 500; color: var(--label-2); }
/* a new best just turns gold */
.tiles div.hi b, .tiles div.hi span { color: var(--yellow); }

/* panels */
.panel {
  z-index: 14; bottom: 0; width: min(520px, 100%); max-height: calc(100% - var(--safe-t) - 30px);
  display: flex; flex-direction: column; overflow: hidden; padding-bottom: var(--safe-b);
  border-radius: 22px 22px 0 0; background: var(--sheet);
  box-shadow: inset 0 1px 0 var(--line), 0 -10px 40px rgba(0, 0, 0, 0.5);
}
.panel::before { content: ""; position: absolute; top: 6px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: rgba(255, 255, 255, 0.24); }
.panel.hide { transform: translate(-50%, calc(100% + 40px)); opacity: 0; pointer-events: none; }
.panel header { position: relative; display: flex; align-items: center; justify-content: center; min-height: 56px; padding: 10px 76px 6px; }
.panel h2 { margin: 0; font-family: var(--font-title); font-weight: 700; font-size: 16px; line-height: 1.2; text-align: center; }
.panel .close { position: absolute; right: 8px; top: 50%; transform: translateY(-40%); height: 40px; padding: 0 10px; font-size: 17px; font-weight: 600; color: var(--accent-hi); }
.panel .body { min-height: 0; padding: 2px 16px 24px; overflow-y: auto; font-size: 15px; line-height: 1.5; color: var(--label-2); touch-action: pan-y; -webkit-overflow-scrolling: touch; }
.panel .body h3 { margin: 22px 0 8px 2px; font-family: var(--font-title); font-size: 13px; font-weight: 700; color: var(--label-2); }
.panel .body p { margin: 8px 2px; }
.panel .body b { color: var(--label); font-weight: 650; }
/* How to play: one quiet row per idea, each with a glyph key */
.how { display: grid; margin-top: 2px; border-radius: 18px; background: var(--surface); overflow: hidden; }
.how .hrow { position: relative; display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; align-items: start; padding: 13px 16px 14px 12px; }
.how .hrow + .hrow::before { content: ""; position: absolute; left: 56px; right: 0; top: 0; height: 1px; background: var(--sep); }
.how .hic { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: var(--surface-2); color: var(--label); }
.how .hic svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.how h3 { margin: 0 0 3px; font-family: var(--font-title); font-size: 14px; font-weight: 700; color: var(--label); }
.how p { margin: 0; font-size: 14px; line-height: 1.45; color: var(--label-2); }
.how b { color: var(--label); font-weight: 600; }
.tbl { background: var(--surface); border-radius: 18px; padding: 2px 12px; overflow-x: auto; }
.tbl table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
.tbl th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--label-2); padding: 11px 4px 6px; white-space: nowrap; }
.tbl td { padding: 10px 4px; color: var(--label); box-shadow: inset 0 1px 0 var(--line); white-space: nowrap; }
.tbl td.r, .tbl th.r { text-align: right; }
.tbl td.tot { font-weight: 700; } /* the running total after each level */
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; justify-content: space-between; gap: 8px; padding: 13px 16px; color: var(--label); font-variant-numeric: tabular-nums; }
.list li + li { box-shadow: inset 0 1px 0 var(--line); }
.list li span:first-child { color: var(--label-2); }
.pos { color: var(--green) !important; } .neg { color: var(--label-2) !important; }
.mono { display: block; margin: 4px 0; padding: 10px 12px; border-radius: 10px; background: var(--surface); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--label); word-break: break-all; }
.switch { position: relative; width: 51px; height: 31px; border-radius: 16px; background: rgba(120, 120, 128, 0.32); transition: background 0.2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25); transition: transform 0.25s cubic-bezier(.3, 1.3, .5, 1); }
.switch[aria-checked="true"] { background: var(--green); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.scrim { position: fixed; inset: 0; z-index: 13; background: rgba(0, 0, 0, 0.6); opacity: 0; pointer-events: none; transition: opacity 0.25s; }
.scrim.show { opacity: 1; pointer-events: auto; }
#toast { position: fixed; left: 50%; top: calc(var(--safe-t) + 64px); transform: translate(-50%, -10px); z-index: 20; padding: 12px 18px; border-radius: 16px; background: var(--sheet); box-shadow: inset 0 0 0 1px var(--line), 0 10px 30px rgba(0, 0, 0, 0.45); font-size: 14px; font-weight: 600; opacity: 0; transition: opacity 0.25s, transform 0.25s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- fairness: verify a run ---------- */
.verify { margin-top: 12px; height: 48px; font-size: 15px; }
.verify-out { margin-top: 10px; }
.verify-out.good p b { color: var(--green); }
.verify-out.bad { color: var(--red); font-weight: 600; font-size: 14px; }
.mono-s { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--label); }

/* ---------- profile capsule (lobby) ---------- */
.prof { position: relative; padding: 0 13px 0 4px; gap: 7px; }
.prof .xpwrap { position: relative; width: 30px; height: 30px; flex: none; }
.prof .xpring { width: 30px; height: 30px; transform: rotate(-90deg); }
.prof .xpem { position: absolute; inset: 5px; border-radius: 50%; display: grid; place-items: center; background: var(--av, var(--accent)); color: var(--av-ink, #fff); }
.prof .xpem svg { width: 12px; height: 12px; }
.prof .xpring circle { fill: none; stroke-width: 3; }
.prof .xpring .trk { stroke: rgba(255, 255, 255, 0.14); }
.prof .xpring .val { stroke: var(--yellow); stroke-linecap: round; stroke-dasharray: 94.25; stroke-dashoffset: 94.25; transition: stroke-dashoffset 0.6s cubic-bezier(.2, .9, .2, 1); }
.prof .lbl { font-size: 15px; font-weight: 600; color: var(--label); }

/* ---------- streak meter ---------- */
.streak {
  min-width: 100px; padding: 7px 10px 8px; border-radius: 12px; margin-top: 2px;
  background: var(--glass); -webkit-backdrop-filter: saturate(160%) blur(18px); backdrop-filter: saturate(160%) blur(18px);
  box-shadow: inset 0 0 0 1px var(--glass-line);
  opacity: 0; transform: translateY(-6px) scale(0.96); transform-origin: left top;
  transition: opacity 0.25s, transform 0.3s cubic-bezier(.2, .9, .2, 1);
}
.streak.on { opacity: 1; transform: none; }
.streak.on.under { opacity: 0.14; transition: opacity 0.12s; } /* the ball is flying behind it */
.streak.on.tuck { opacity: 0; transform: translateY(-6px) scale(0.96); } /* out of the way of the checkpoint card */
.stk-top { display: flex; align-items: center; gap: 5px; height: 18px; }
.streak .flame { width: 16px; height: 16px; fill: currentColor; color: #fff; flex: none; transition: color 0.25s; }
.streak b { font-family: var(--font-round); font-size: 18px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.streak #stkT { font-size: 12.5px; font-weight: 600; color: var(--label-2); white-space: nowrap; }
.heat { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin: 7px 0 0; }
.heat i { height: 5px; border-radius: 1px; background: rgba(255, 255, 255, 0.14); transition: background 0.25s; }
.heat i.f { background: #fff; }
.streak small { display: none; } /* what the next swish pays is on the checkpoint card and in How to play */
.streak.t3 .flame { color: rgb(var(--heat)); }
.streak.t3 .heat i.f { background: rgb(var(--heat)); }
.streak.t3 #stkT { color: rgb(var(--heat-text)); }
.streak.t5 .flame { color: rgb(var(--nova-hi)); }
.streak.t5 .heat i.f { background: rgb(var(--nova)); }
.streak.t5 #stkT { color: rgb(var(--nova-text)); }
.streak.broke { animation: stkBreak 0.65s ease-out forwards; }
.streak.broke .flame, .streak.broke #stkT { color: var(--label-3); filter: none; }
@keyframes stkBreak {
  0% { transform: translateX(0); opacity: 1; } 12% { transform: translateX(-6px); } 26% { transform: translateX(5px); }
  40% { transform: translateX(-3px); } 55% { transform: translateX(2px); opacity: 1; } 100% { transform: translateY(5px); opacity: 0; }
}

/* ---------- pot ticker ---------- */
#potCap { transition: color 0.35s, text-shadow 0.35s; }
#potCap.up { color: var(--green); }
.delta { position: absolute; left: 0; right: 0; top: 74px; font-family: var(--font-round); font-size: 12.5px; font-weight: 700; color: var(--green); opacity: 0; white-space: nowrap; text-align: center; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6); }

/* ---------- big moments ---------- */
#callout { position: fixed; left: 0; right: 0; top: max(21%, calc(var(--safe-t) + 168px)); z-index: 4; text-align: center; pointer-events: none; opacity: 0; }
#callout .c1 {
  display: inline-block; padding: 0 8px;
  font-family: var(--font-round); font-weight: 700; font-size: 42px; line-height: 1.05;
  color: #ffffff; text-shadow: 0 2px 14px rgba(0, 0, 0, 0.5);
}
#callout .c2 { margin-top: 6px; font-size: 14px; font-weight: 600; color: rgba(255, 255, 255, 0.8); text-shadow: 0 1px 10px rgba(0, 0, 0, 0.7); }
#callout .c2:empty { display: none; }
#callout.fire .c1 { color: rgb(var(--heat-text)); }
#callout.nova .c1 { color: rgb(var(--nova-text)); }
#callout.gold .c1 { color: var(--gold); }
#callout.green .c1 { color: var(--green); }

/* ---------- the Challenges tab: today's specials and the daily pot, each card under a marquee band in its own colour;
   details on their pages ---------- */
.cc { margin-top: 14px; border-radius: 22px; background: var(--surface); overflow: hidden; }
.vtitle + .cc { margin-top: 16px; }
.cc-open { display: grid; grid-template-columns: minmax(0, 1fr); width: 100%; padding: 14px 16px 0 18px; text-align: left; transition: transform 0.3s var(--spring); }
.cc-open:active { transform: scale(0.98); transition-duration: 0.08s; }
.cc-open > span:not(.chev) { grid-column: 1; min-width: 0; }
.cc-h .cc-t { display: inline-flex; align-items: center; gap: 6px; }
.cc-h .cc-t .chev { display: inline-grid; width: 13px; height: 13px; color: var(--label-3); }
.cc-h .cc-t .chev svg { width: 13px; height: 13px; }
.cc-k { display: flex; align-items: center; gap: 7px; font-family: var(--font-round); font-size: 13px; font-weight: 700; color: var(--label); }
.cc-k svg { flex: none; width: 15px; height: 15px; }
.cc-n { margin-top: 4px; font-family: var(--font-title); font-size: 26px; font-weight: 700; line-height: 1.15; color: var(--label); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cc-s { margin-top: 2px; font-size: 14px; line-height: 1.35; color: var(--label-2); }
.cc-art { grid-column: 1 / -1; display: block; width: 100%; height: 58px; margin-top: 10px; }
.cc-big { display: flex; align-items: baseline; margin-top: 2px; font-family: var(--font-round); font-size: 40px; font-weight: 700; line-height: 1.1; color: var(--label); font-variant-numeric: tabular-nums; }
.cc-big .unit { margin-left: 8px; font-size: 16px; color: var(--label-2); }
.cc-g { margin-top: 10px; font-family: var(--font-title); font-size: 16px; font-weight: 700; line-height: 1.25; color: var(--label); }
.cc-act { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 14px 0 0 18px; padding: 12px 14px 15px 0; box-shadow: inset 0 1px 0 var(--line); }
.cc-v { min-width: 0; font-size: 15px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cc-v b { font-family: var(--font-round); font-size: 21px; font-weight: 700; color: var(--label); }
/* the marquee band at the top of a challenge card: its name and its clock, on a lighter graphite */
.cc-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 38px; padding: 8px 16px 8px 18px; background: var(--band); color: var(--label); box-shadow: inset 0 -1px 0 var(--line); }
.cc-h .cc-k { margin: 0; }
.cc-t { font-size: 13px; font-weight: 600; color: var(--label-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.cc-h .cc-t { color: var(--label-2); }
/* pills: a grey capsule for a state; the purple key starts or spends a run */
.pill { flex: none; display: inline-flex; align-items: center; height: 34px; padding: 0 15px; border-radius: 17px; background: var(--surface-2); font-size: 14px; font-weight: 700; color: var(--label); white-space: nowrap; font-variant-numeric: tabular-nums; transition: transform 0.3s var(--spring), box-shadow 0.3s var(--spring); }
.pill.go { margin-bottom: 3px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-round); font-weight: 700; box-shadow: 0 3px 0 var(--accent-edge); }
.pill.go:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-edge); transition-duration: 0.06s; }
.pill[disabled] { opacity: 0.5; }
.pill.in, .pill.ok, .pill.off { font-weight: 600; color: var(--label-2); background: rgba(255, 255, 255, 0.06); }
.pill.ok { color: var(--green); }
/* today's specials: one card, a row for each with its prize multiple, twist and length, its prize and Play; a row opens its page */
.spr { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 12px; margin-left: 16px; padding: 12px 16px 12px 0; }
.spr + .spr { box-shadow: inset 0 1px 0 var(--line); }
.spr:last-child { padding-bottom: 15px; }
.spr-open { display: grid; grid-template-columns: 46px minmax(0, 1fr); column-gap: 12px; align-items: center; min-width: 0; padding: 2px 0 4px; text-align: left; transition: transform 0.3s var(--spring); }
.spr-open:active { transform: scale(0.97); transition-duration: 0.08s; }
.spr-x { display: grid; place-items: center; width: 46px; height: 43px; border-radius: 12px; background: var(--surface-2); color: var(--label); box-shadow: 0 3px 0 var(--key-edge); font-family: var(--font-round); font-size: 17px; font-weight: 700; }
.spr-t { min-width: 0; }
.spr-t b { display: block; font-family: var(--font-title); font-size: 15.5px; font-weight: 700; line-height: 1.25; color: var(--label); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spr-t span { display: -webkit-box; margin-top: 2px; font-size: 13px; line-height: 1.35; color: var(--label-2); overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 2; } /* the twist in full, on two lines */
.spr-act { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.spr-win { font-size: 12.5px; color: var(--label-2); white-space: nowrap; }
.spr-win b { font-family: var(--font-round); font-size: 14px; font-weight: 700; color: var(--label); font-variant-numeric: tabular-nums; }
/* meters are lit segments, like the scoreboard's */
.chap-bar, .xp-bar, .pxp, .mneed .bar, .sp-unlock .bar {
  -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 9px, transparent 9px 12px); mask-image: repeating-linear-gradient(90deg, #000 0 9px, transparent 9px 12px);
}
/* until the specials open: how much regular play is left, on the card and on a special's page */
.sp-cc .sp-unlock { padding-top: 12px; }
.sp-unlock + .spr { box-shadow: inset 0 1px 0 var(--sep); }
.sp-lock { margin-top: 16px; }
.sp-lock p { margin: 0; padding: 0 16px 13px; font-size: 13px; line-height: 1.4; color: var(--label-2); }
/* every special at this prize is cleared for today */
.sp-done b { display: block; padding: 14px 16px 4px; font-family: var(--font-round); font-weight: 700; font-size: 17px; color: var(--green); }
.tiles b i { font-style: normal; font-size: 0.62em; color: var(--label-2); }
.sp-card { border-radius: 22px; background: var(--surface); overflow: hidden; }
.sp-head { padding: 14px 16px 4px; }
.sp-k { font-size: 13px; color: var(--label-2); }
.sp-name { margin-top: 2px; font-family: var(--font-title); font-weight: 700; font-size: 24px; line-height: 1.1; color: var(--label); }
.sp-blurb { margin-top: 4px; font-size: 15px; color: var(--label-2); }
.sp-course { display: block; width: 100%; height: 118px; }
.sp-cap { padding: 0 16px 14px; font-size: 12px; color: var(--label-3); }
.sp-prize { margin: 22px 0 6px; text-align: center; }
.sp-prize .k { display: block; font-size: 13px; color: var(--label-2); }
.sp-prize .big { margin: 8px 0 0; font-size: 46px; }
.sp-prize .x { display: block; margin-top: 8px; font-family: var(--font-round); font-size: 13px; font-weight: 700; color: var(--green); }
.vcol > .tiles { margin: 16px 0 0; text-align: center; }
.vtitle + .sp-card, .vtitle + .pot-goal { margin-top: 18px; }
.sp-odds { margin-top: 10px; }
.sp-odds + .foot { margin-top: 8px; }
.sp-odds .row { min-height: 44px; font-size: 15px; color: var(--label); }
.sp-odds .row b { font-weight: 400; color: var(--label-2); font-variant-numeric: tabular-nums; }
#potCap.prize::before { content: "Win"; margin-right: 4px; font-family: var(--font); font-size: 0.85em; font-weight: 600; color: var(--label-2); }
/* missions: the SOL a mission pays, and the play that unlocks a window's SOL */
.mxp { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
.mxp small { font-family: var(--font); font-size: 12px; font-weight: 500; color: var(--label-2); }
.mrow.done .mxp small { color: var(--label-3); }
.mrow.done .mxp small.paid { color: var(--green); }
.mneed, .sp-unlock { padding: 12px 16px 13px; }
.mneed .mn-h, .sp-unlock .mn-h { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--label-2); }
.mneed .mn-h b, .sp-unlock .mn-h b { font-family: var(--font-round); font-weight: 700; color: var(--label); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mneed .bar, .sp-unlock .bar { height: 6px; margin-top: 10px; background: var(--track); overflow: hidden; }
.mneed .bar i, .sp-unlock .bar i { display: block; height: 100%; background: var(--gold); }
.mneed.met .bar i { background: var(--green); }
.mneed + .mrow { box-shadow: inset 0 1px 0 var(--sep); }

/* ---------- the pot page ---------- */
.pot-goal { display: flex; align-items: center; gap: 12px; margin: 2px 0 6px; }
.pot-ic { display: grid; place-items: center; flex: none; width: 42px; height: 42px; border-radius: 12px; background: var(--surface-2); color: var(--label); }
.pot-ic svg { width: 22px; height: 22px; }
.pot-goal b { display: block; font-family: var(--font-title); font-size: 16px; font-weight: 700; color: var(--label); }
.pot-goal span { font-size: 13px; color: var(--label-2); }
.tiles b.sm { font-size: 16px; line-height: 1.6; white-space: nowrap; } /* a time left, in words */
.pot-me { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 18px; background: var(--surface); }
.pot-me svg { flex: none; width: 18px; height: 18px; margin-top: 1px; color: var(--accent-hi); }
.pot-me.done svg { color: var(--green); }
.pot-me b { display: block; font-size: 15px; font-weight: 700; color: var(--label); }
.pot-me span { font-size: 13px; line-height: 1.4; color: var(--label-2); }
#potEnter { width: 100%; }
.pot-rules { margin: 14px 2px 0; font-size: 12.5px; line-height: 1.45; color: var(--label-3); }
.pot-last { display: flex; flex-direction: column; gap: 3px; margin-top: 14px; padding-top: 12px; box-shadow: inset 0 1px 0 var(--line); font-size: 13px; line-height: 1.4; color: var(--label-2); }
.pot-last .k { font-size: 12px; font-weight: 700; color: var(--label-3); }
.pot-last .won { color: var(--green); font-weight: 700; }
.pot-demo { margin-top: 14px; padding: 12px 14px 8px; border-radius: 18px; background: var(--surface); }
.pot-demo p { margin: 0 0 10px; font-size: 12.5px; line-height: 1.4; color: var(--label-2); }
.pot-demo .btn { width: 100%; height: 44px; font-size: 15px; }
/* the duel's page: you and your rival on the same line of rings */
.du-vs { display: flex; align-items: center; gap: 10px; margin: 14px 0 0; padding: 13px 16px; border-radius: 18px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--hair); }
.du-b { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid #d6c8f5; background: rgba(214,200,245,0.14); }
.du-b.you { border-color: var(--accent); background: var(--accent); }
.du-n { font-family: var(--font-round); font-size: 14px; font-weight: 700; color: var(--label); }
.du-line { flex: 1; height: 2px; border-radius: 1px; background: repeating-linear-gradient(90deg, var(--track) 0 7px, transparent 7px 12px); }
.pot-demo p:last-child { margin-bottom: 4px; }
.gain.pot svg { color: var(--gold); }


/* ---------- checkpoint: what's next ---------- */
.next { margin: 20px 2px 16px; padding: 14px 2px 0; box-shadow: inset 0 1px 0 var(--line); text-align: left; }
.nx-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 15px; font-weight: 600; }
.nx-h b { font-family: var(--font-round); font-size: 16px; font-weight: 700; line-height: 1; color: var(--label); white-space: nowrap; }
.nx-f { margin-top: 2px; font-size: 13px; color: var(--label-2); }
.nx-s { display: flex; align-items: center; gap: 5px; margin-top: 9px; font-size: 13px; font-weight: 600; color: rgb(var(--heat-text)); }
.nx-s svg { width: 14px; height: 14px; fill: currentColor; flex: none; }
.nx-s.nova { color: rgb(var(--nova-text)); }
.nx-r { margin-top: 7px; font-size: 12px; color: var(--label-3); font-variant-numeric: tabular-nums; }
.nx-s:empty, .nx-r:empty, .nx-f:empty { display: none; }
.cp-badge { display: inline-block; margin-left: 8px; padding: 3px 8px; border-radius: 7px; font-family: var(--font); font-size: 12.5px; font-weight: 700; vertical-align: 3px; background: var(--green-soft); color: var(--green); }

/* ---------- goals reached mid-run ---------- */
#notice {
  position: fixed; left: 50%; bottom: calc(var(--safe-b) + 18px); z-index: 6; pointer-events: none;
  display: flex; align-items: center; gap: 10px; max-width: calc(100% - 28px); padding: 8px 16px 8px 8px; border-radius: 16px;
  background: rgba(21, 18, 30, 0.9); -webkit-backdrop-filter: saturate(160%) blur(18px); backdrop-filter: saturate(160%) blur(18px);
  box-shadow: inset 0 0 0 1px var(--line), 0 10px 30px rgba(0, 0, 0, 0.4);
  opacity: 0; transform: translate(-50%, 14px) scale(0.98); transition: opacity 0.3s, transform 0.4s cubic-bezier(.2, .9, .2, 1);
}
#notice.show { opacity: 1; transform: translate(-50%, 0); }
#notice .ni { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: none; background: var(--green); color: var(--green-ink); }
#notice .ni svg { width: 17px; height: 17px; }
#notice .nb { display: flex; flex-direction: column; min-width: 0; }
#notice .nt { font-family: var(--font-round); font-size: 13px; font-weight: 700; color: var(--label); white-space: nowrap; }
#notice .ns { margin-top: 1px; font-size: 12px; font-weight: 550; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- result: progression ---------- */
.xp { margin: -4px 0 12px; text-align: left; }
.xp-h { display: flex; justify-content: space-between; margin: 0 2px 7px; font-size: 13px; font-weight: 600; color: var(--label-2); }
.xp-h .num { color: var(--yellow); font-weight: 700; }
.xp-bar { position: relative; height: 8px; background: var(--track); overflow: hidden; }
.xp-bar i { display: block; height: 100%; width: 0; background: var(--gold); }
.xp.up .xp-h span:first-child { color: var(--yellow); }
.gains { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 0 0 14px; }
.gains:empty { display: none; }
/* what a run earned comes on arcade tickets: a chip with a notch at each end */
.gain {
  display: inline-flex; align-items: center; gap: 5px; padding: 6px 13px; border-radius: 6px; font-size: 12px; font-weight: 600;
  background: var(--surface-2); color: var(--label); white-space: nowrap; animation: gainIn 0.4s cubic-bezier(.2, .9, .2, 1) both;
  -webkit-mask: radial-gradient(circle 5px at 0 50%, transparent 4.5px, #000 5px) 0 0 / 51% 100% no-repeat, radial-gradient(circle 5px at 100% 50%, transparent 4.5px, #000 5px) 100% 0 / 51% 100% no-repeat;
  mask: radial-gradient(circle 5px at 0 50%, transparent 4.5px, #000 5px) 0 0 / 51% 100% no-repeat, radial-gradient(circle 5px at 100% 50%, transparent 4.5px, #000 5px) 100% 0 / 51% 100% no-repeat;
}
.gain svg { width: 14px; height: 14px; flex: none; }
.gain.ach svg { color: var(--yellow); }
.gain.unlock svg { color: var(--green); }
.gain.daily svg { color: var(--green); }
.gain.lvl { background: var(--green-soft); color: var(--green); }
button.gain { font: inherit; font-size: 12px; font-weight: 600; color: var(--label); cursor: pointer; padding: 4px 10px 4px 11px; }
.gain.unlock canvas { width: 22px; height: 22px; flex: none; }
.gain.unlock em { margin-left: 3px; padding: 2px 8px; border-radius: 6px; font-style: normal; font-weight: 700; background: var(--surface-3); color: var(--label); }
.gain.unlock.on em { background: var(--green-soft); color: var(--green); }
@keyframes gainIn { from { opacity: 0; transform: translateY(6px) scale(0.96); } to { opacity: 1; transform: none; } }

/* ---------- locker items ---------- */
.item { position: relative; aspect-ratio: 1 / 1; border-radius: 14px; background: var(--surface); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.item canvas { width: 76%; height: 76%; }
.item:active { transform: scale(0.96); }
.item.eq { box-shadow: inset 0 0 0 2px var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.item.locked canvas { opacity: 0.34; filter: grayscale(1); }
.item .lock { position: absolute; top: 7px; right: 7px; width: 12px; height: 12px; color: var(--label-3); }
.item .new { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 4px; background: var(--green); }
.reset-note { margin: 8px 4px 0; font-size: 12px; color: var(--label-3); }
.bests { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); padding: 12px 0 11px; border-radius: 18px; background: var(--surface); }
.bests div { padding: 0 4px; text-align: center; }
.bests div + div { box-shadow: inset 1px 0 0 var(--line); }
.bests b { display: block; font-family: var(--font-round); font-size: 20px; font-weight: 700; color: var(--label); font-variant-numeric: tabular-nums; }
.bests span { display: block; margin-top: 1px; font-size: 11px; font-weight: 600; color: var(--label-2); }
.bests em { display: block; font-style: normal; font-size: 11px; color: var(--label-2); margin-top: 1px; }

/* ---------- navigation: a tab bar docked to the bottom edge; the selected tab lights a segment over its icon ---------- */
#tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 11;
  height: calc(var(--tab-h) + var(--safe-b)); padding: 0 8px var(--safe-b);
  display: grid; grid-template-columns: repeat(4, minmax(0, 104px)); justify-content: center;
  background: #050308; /* solid: a scrolling page never shows through its labels */
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.09);
  transition: transform 0.4s cubic-bezier(.2, .9, .2, 1), opacity 0.25s;
  touch-action: manipulation;
}
#tabbar button {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px;
  padding-top: 8px; color: #6e7383; font-size: 10.5px; font-weight: 600; letter-spacing: 0.01em;
  transition: color 0.15s;
}
#tabbar button::before { content: ""; position: absolute; top: 0; left: 50%; width: 24px; height: 3px; margin-left: -12px; border-radius: 0 0 2px 2px; background: var(--accent); transform: scaleX(0); transition: transform 0.35s var(--spring); }
#tabbar button[aria-selected="true"]::before { transform: scaleX(1); }
#tabbar svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#tabbar svg .fill { fill: currentColor; stroke: none; }
#tabbar button[aria-selected="true"] { color: var(--accent-hi); }
#tabbar button[aria-selected="true"] svg { stroke-width: 2.1; }
/* the tab icon's pop on a tap is played by hudAnim() in game.js */
#tabbar .badge { position: absolute; top: 6px; left: calc(50% + 8px); width: 8px; height: 8px; border-radius: 4px; background: var(--green); box-shadow: 0 0 0 2px #000; display: none; }
#tabbar .badge.on { display: block; }
.hud-play #tabbar { transform: translateY(100%); opacity: 0; pointer-events: none; }

/* ---------- Play and Locker: black pages with the live arena showing through a rounded window ---------- */
.home {
  top: 0; bottom: calc(var(--safe-b) + var(--tab-h));
  width: min(100%, max(var(--col), 400px));
  display: flex; flex-direction: column;
  padding: calc(var(--safe-t) + 10px) 16px 10px;
  background: none; -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none; border-radius: 0;
  transform: translateX(-50%);
  transition: opacity 0.32s ease;
}
.home.hide { transform: translateX(-50%); opacity: 0; pointer-events: none; }
.home > :not(.hero) { transition: opacity 0.14s; } /* into a run: the words go first, then the black opens onto the court */
.home.hide > :not(.hero) { opacity: 0; }
.ltitle, .vtitle { margin: 0; height: 40px; font-family: var(--font-title); font-weight: 700; font-size: 28px; line-height: 40px; white-space: nowrap; }
.ltitle { position: relative; z-index: 1; flex: none; padding-right: 150px; overflow: hidden; } /* the balance sits at the end of this line; positioned so it paints over the window's black */
/* the wordmark stands on a purple edge, like the keys */
#lobby .ltitle { font-size: 30px; font-weight: 800; text-shadow: 0 2px 0 var(--accent); }
.controls, .home > .lk-cats, .home > .lk-info, .home > .lk-grid { position: relative; z-index: 1; }
/* the window: a transparent rounded box whose spread shadow paints the page black around it */
.hero { flex: 1 1 auto; min-height: 120px; margin: 12px 0 14px; border-radius: 24px; pointer-events: none;
  box-shadow: 0 0 0 100vmax var(--bg), inset 0 0 0 1px rgba(255, 255, 255, 0.1); }
.controls { flex: none; }

.instant .home, .instant .home > *, .instant .view { transition: none !important; }

/* ---------- full-page tabs: Challenges and Profile ---------- */
.view { position: fixed; inset: 0; z-index: 3; background: var(--bg); transition: opacity 0.2s, transform 0.35s cubic-bezier(.2, .9, .2, 1), visibility 0s; }
.view.hide { opacity: 0; pointer-events: none; visibility: hidden; transition: opacity 0.2s, transform 0.35s cubic-bezier(.2, .9, .2, 1), visibility 0s 0.35s; }
/* the top bar: clear over the large title, a dark material once the page scrolls under it */
.view::before { content: ""; position: absolute; left: 0; right: 0; top: 0; z-index: 1; height: calc(var(--safe-t) + 58px); pointer-events: none;
  background: rgba(0, 0, 0, 0.82); -webkit-backdrop-filter: saturate(160%) blur(18px); backdrop-filter: saturate(160%) blur(18px);
  box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.09); opacity: 0; transition: opacity 0.18s; }
.view.scrolled::before { opacity: 1; }
.vscroll {
  position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y;
  padding: calc(var(--safe-t) + 10px) 16px calc(var(--safe-b) + var(--tab-h) + 28px);
  -webkit-user-select: text; user-select: text;
}
.vcol { max-width: calc(max(var(--col), 400px) - 32px); margin: 0 auto; } /* one column for every page, the Play tab's and the top bar's */
.vtitle { padding-right: 150px; }
.vsub { margin: 6px 0 0; font-size: 15px; line-height: 1.4; color: var(--label-2); }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 28px 2px 10px; }
.sec-h h3 { margin: 0; font-family: var(--font-title); font-size: 17px; font-weight: 700; color: var(--label); }
.sec-h span { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 400; color: var(--label-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sec-h span svg { width: 14px; height: 14px; }
.vscroll .tiles { margin: 0; text-align: center; }
#pgBody[data-kind="special"] .tiles, #pgBody[data-kind="pot"] .tiles { margin-top: 12px; }
#pgBody[data-kind="pot"] .pot-me { margin-top: 16px; }
.panel .tiles { text-align: center; }
.vscroll .group + .group { margin-top: 10px; }

/* mission rows: a progress ring, the goal and its XP */
.mrow { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px 12px 12px; }
.mrow + .mrow { box-shadow: inset 0 1px 0 var(--sep); }
.mring { position: relative; width: 36px; height: 36px; }
.mring svg { width: 36px; height: 36px; transform: rotate(-90deg); }
.mring circle { fill: none; stroke-width: 3.6; }
.mring .trk { stroke: rgba(255, 255, 255, 0.1); }
.mring .val { stroke: var(--green); stroke-linecap: butt; transition: stroke-dasharray 0.6s cubic-bezier(.2, .9, .2, 1); }
.mring.zero .val { display: none; }
.mring .ck { position: absolute; inset: 0; display: none; place-items: center; border-radius: 50%; background: var(--green); color: var(--green-ink); }
.mring .ck svg { width: 18px; height: 18px; transform: none; }
.mrow.done .mring .ck { display: grid; }
.mt { min-width: 0; }
.mt b { display: block; font-size: 15px; font-weight: 600; line-height: 1.25; color: var(--label); }
.mt span { display: block; margin-top: 1px; font-size: 12.5px; color: var(--label-3); font-variant-numeric: tabular-nums; }
.mxp { font-family: var(--font-round); font-size: 12.5px; font-weight: 700; color: var(--label); white-space: nowrap; font-variant-numeric: tabular-nums; }
.mrow.done .mt b { color: var(--label-2); }
.mrow.done .mxp { color: var(--label-3); }

/* career: the chapter you're on, its reward, then the others */
.chap { border-radius: 18px; background: var(--surface); overflow: hidden; }
.chap-top { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; align-items: center; padding: 16px 16px 12px; }
.rew { position: relative; width: 84px; height: 84px; border-radius: 16px; overflow: hidden; display: grid; place-items: center;
  background: var(--surface-2); }
.rew canvas { width: 82%; height: 82%; }
.chap-k { font-size: 12.5px; font-weight: 600; color: var(--label-3); font-variant-numeric: tabular-nums; }
.chap-n { margin: 2px 0 4px; font-family: var(--font-title); font-weight: 700; font-size: 19px; line-height: 1.2; color: var(--label); }
.chap-r { font-size: 13px; line-height: 1.35; color: var(--label-2); }
.chap-r b { color: var(--label); font-weight: 650; }
.chap-bar { height: 6px; margin: 0 16px 10px; background: var(--track); overflow: hidden; }
.chap-bar i { display: block; height: 100%; background: var(--gold); transition: width 0.6s cubic-bezier(.2, .9, .2, 1); }
.chap .mrow:first-of-type { box-shadow: inset 0 1px 0 var(--sep); }
.chlist { margin-top: 10px; border-radius: 18px; background: var(--surface); }
.chli { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 50px; padding: 6px 14px 6px 12px; }
.chli + .chli { box-shadow: inset 0 1px 0 var(--sep); }
.chli .cs { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); color: var(--label-3); }
.chli .cs svg { width: 14px; height: 14px; }
.chli.done .cs { background: var(--green); color: var(--green-ink); }
.chli.now .cs { color: var(--accent-hi); box-shadow: inset 0 0 0 1.5px var(--accent); }
.chli b { font-size: 14px; font-weight: 600; color: var(--label); }
.chli.locked b { color: var(--label-2); }
.chli .cr { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--label-3); white-space: nowrap; }
.chli .cr canvas { width: 26px; height: 26px; border-radius: 7px; }
.chli.locked .cr canvas { opacity: 0.35; filter: grayscale(0.8); }

/* ---------- Locker (from Profile): a navigation bar with its back button, the arena in its window, then the collection ---------- */
#vLocker { padding-bottom: 0; }
.navrow { position: relative; z-index: 1; flex: none; display: flex; align-items: center; justify-content: center; height: 40px; }
.navrow .back { position: absolute; left: -8px; top: 0; display: inline-flex; align-items: center; height: 40px; padding: 0 10px 0 0; font-size: 17px; color: var(--accent-hi); }
.navrow .back svg { width: 24px; height: 24px; }
.navrow .back:active { opacity: 0.55; }
.navtitle { margin: 0; font-family: var(--font-title); font-size: 16px; font-weight: 700; }
body[data-tab="locker"] #hud { opacity: 0; visibility: hidden; }
#lkHero { margin-bottom: 14px; }
.lk-cats { flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; padding: 3px; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.lk-cats button {
  position: relative; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 6px;
  height: 46px; border-radius: 11px; color: var(--label-2); font-size: 13px; font-weight: 600;
  transition: background 0.2s, color 0.2s;
}
.lk-cats canvas { width: 28px; height: 28px; }
.lk-cats button[aria-selected="true"] { background: var(--surface-3); color: var(--label); }
.lk-cats .new { position: absolute; top: 5px; right: 6px; width: 7px; height: 7px; border-radius: 4px; background: var(--green); }
.lk-info { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 58px; padding: 8px 4px 8px 6px; }
.lk-info .li-t { min-width: 0; }
.lk-info b { display: block; font-family: var(--font-title); font-size: 16px; font-weight: 700; color: var(--label); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lk-info .li-s { display: block; margin-top: 2px; font-size: 12.5px; color: var(--label-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rar { font-weight: 700; }
.rar.r0 { color: var(--label-3); } .rar.r1 { color: var(--label-2); } .rar.r2 { color: var(--label); } .rar.r3 { color: var(--accent-hi); }
.lk-info .li-a { flex: none; height: 32px; margin-bottom: 3px; padding: 0 15px; border-radius: 16px; font-family: var(--font-round); font-size: 14px; font-weight: 700; background: var(--accent); color: var(--accent-ink); box-shadow: 0 3px 0 var(--accent-edge); white-space: nowrap; transition: transform 0.25s var(--spring), box-shadow 0.25s var(--spring); }
.lk-info .li-a:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-edge); transition-duration: 0.06s; }
.lk-info .li-a.on { background: rgba(255, 255, 255, 0.06); color: var(--label-2); box-shadow: none; transform: translateY(3px); pointer-events: none; }
.lk-info .li-a.lock { display: inline-flex; align-items: center; gap: 5px; background: none; box-shadow: none; color: var(--label-3); pointer-events: none; padding: 0 2px; font-family: var(--font); font-weight: 600; }
.lk-info .li-a.lock svg { width: 13px; height: 13px; }
.lk-grid {
  flex: 0 0 auto; height: clamp(190px, 36vh, 400px); min-height: 0; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; -webkit-overflow-scrolling: touch;
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: max-content; gap: 8px; align-content: start; padding: 2px 2px 14px;
  -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 18px), transparent); mask-image: linear-gradient(180deg, #000 calc(100% - 18px), transparent);
}
.lk-grid .item { aspect-ratio: 0.84; flex-direction: column; justify-content: center; gap: 2px; padding: 6px 4px 7px; transition: background 0.2s, box-shadow 0.2s, transform 0.12s; }
.lk-grid .item canvas { width: 74%; height: auto; aspect-ratio: 1; }
.lk-grid .item .nm { max-width: 100%; font-size: 11px; font-weight: 600; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lk-grid .item.eq .nm { color: var(--label); }
.lk-grid .item.sel:not(.eq) { box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.4); }
.lk-grid .item.locked .nm { color: var(--label-3); }
.lk-grid .item .lock { z-index: 1; }

/* ---------- Profile ---------- */
.pcard { display: grid; grid-template-columns: 68px minmax(0, 1fr) 14px; gap: 14px; align-items: center; margin-top: 16px; padding: 16px 14px 16px 16px; border-radius: 22px; text-align: left; width: 100%;
  background: var(--surface); transition: transform 0.3s var(--spring); }
.pcard:active { transform: scale(0.98); transition-duration: 0.08s; }
.pcard .chev { width: 14px; height: 14px; color: var(--label-3); }
.pav { position: relative; width: 76px; height: 76px; border-radius: 38px; display: grid; place-items: center; color: var(--av-ink, #fff);
  background: var(--av, var(--accent)); }
.pav svg { width: 40px; height: 40px; }
.pcard .pav { width: 68px; height: 68px; border-radius: 34px; }
.pcard .pav svg { width: 34px; height: 34px; }
.pid { min-width: 0; }
.pname { display: block; font-family: var(--font-title); font-weight: 700; font-size: 20px; line-height: 1.2; color: var(--label); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptitle { display: inline-flex; align-items: center; gap: 5px; margin-top: 3px; font-size: 13px; font-weight: 600; color: var(--accent-hi); }
.ptitle svg { width: 13px; height: 13px; }
/* the level and its XP, under the name */
.plv { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; font-family: var(--font-round); font-size: 12.5px; font-weight: 700; color: var(--label); }
.plv .num { font-weight: 600; color: var(--label-2); }
.pxp { display: block; height: 6px; margin-top: 7px; background: var(--track); overflow: hidden; }
.pxp i { display: block; height: 100%; background: var(--gold); }
.vscroll .bests { margin-top: 10px; }
.trophies { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tro { padding: 14px 8px 12px; border-radius: 16px; background: var(--surface); text-align: center; }
.tro .ti { width: 42px; height: 42px; margin: 0 auto 8px; border-radius: 21px; display: grid; place-items: center; background: var(--surface-2); color: var(--label-2); }
.tro .ti svg { width: 21px; height: 21px; }
.tro.got .ti { background: var(--green); color: var(--green-ink); }
.tro b { display: block; font-size: 12.5px; font-weight: 650; line-height: 1.2; color: var(--label); }
.tro span { display: block; margin-top: 3px; font-size: 11px; line-height: 1.3; color: var(--label-3); }
.tro:not(.got) b { color: var(--label-2); }
.vscroll .list { border-radius: 18px; background: var(--surface); }
.menu-list { border-radius: 18px; background: var(--surface); overflow: hidden; }
.vcol > .menu-list, .vcol > .group + .menu-list { margin-top: 22px; }
.vcol > .pcard + .menu-list { margin-top: 22px; }
.menu-list .mv .dot { display: inline-block; width: 9px; height: 9px; border-radius: 5px; background: var(--green); vertical-align: middle; }
.menu-list > button, .mrow-sw { position: relative; display: grid; grid-template-columns: 29px minmax(0, 1fr) auto 14px; gap: 12px; align-items: center; width: 100%; min-height: 50px; padding: 0 14px; text-align: left; font-size: 17px; font-weight: 400; color: var(--label); }
.mrow-sw { grid-template-columns: 29px minmax(0, 1fr) auto; padding-right: 12px; }
.menu-list > * + *::before { content: ""; position: absolute; left: 55px; right: 0; top: 0; height: 1px; background: var(--sep); } /* separators start after the icon */
.menu-list .mn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-list .mv { font-size: 15px; font-weight: 600; color: var(--label-2); white-space: nowrap; }
.vscroll .bests + .menu-list { margin-top: 10px; }
.menu-list > button:active { background: rgba(255, 255, 255, 0.06); }
.menu-list .mi { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--surface-2); color: var(--label); } /* one colour: every row's key is graphite */
.menu-list .mi svg { width: 17px; height: 17px; }
.menu-list .chev { width: 14px; height: 14px; color: var(--label-3); }
.empty { padding: 16px; border-radius: 18px; background: var(--surface); font-size: 14px; color: var(--label-2); }

/* ---------- pages: pushed over the current tab, a back button in the top bar and the large title under it ---------- */
.view.page { z-index: 8; }
.view.page.hide { transform: translateX(32px); }
.view.page .vscroll { padding-top: calc(var(--safe-t) + 54px); }
.pg-head { position: absolute; left: 0; right: 0; top: 0; z-index: 2; pointer-events: none; padding: calc(var(--safe-t) + 10px) max(8px, calc((100% - max(var(--col), 400px)) / 2 + 8px)) 0; }
.pg-head .back { height: 40px; padding: 0 12px 0 2px; gap: 0; background: none; -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none; font-size: 17px; font-weight: 400; color: var(--accent-hi); }
.pg-head .back svg { width: 24px; height: 24px; }
.pg-head .back:active { opacity: 0.55; transform: none; }
#hud { transition: opacity 0.2s, visibility 0s; }
.page-open #hud { opacity: 0; visibility: hidden; transition: opacity 0.2s, visibility 0s 0.2s; }
.page-open #lobby, .page-open #vLocker { opacity: 0; pointer-events: none; }
.page-open #pauseCard { opacity: 0; pointer-events: none; }
.view.page .vtitle { padding-right: 0; }
/* reading text on pages: How to play, the odds notes, fairness, the wallet */
.prose { font-size: 15px; line-height: 1.5; color: var(--label-2); }
.prose h3 { margin: 26px 2px 4px; font-family: var(--font-title); font-size: 15px; font-weight: 700; color: var(--label); }
.prose p { margin: 8px 2px; }
.prose b { color: var(--label); font-weight: 600; }
.vtitle + .prose { margin-top: 14px; }
.vtitle + .how { margin-top: 18px; }
.vtitle + .prose > p:first-child { font-size: 17px; line-height: 1.45; color: var(--label); }
.odds-seg { margin: 20px 0 12px; }
.tbl + .prose { margin-top: 12px; }
.vtitle + .tiles { margin-top: 20px; }
.vcol > .btn, .vcol > .actions { margin-top: 14px; }
.vsub + .trophies, .vsub + .runs, .vsub + .empty, .vsub + .group, .vsub + .chap { margin-top: 16px; }
.vtitle + .empty { margin-top: 20px; }
/* recent runs: how it ended, tier, bet and when, then what it made */
.runs { border-radius: 18px; background: var(--surface); overflow: hidden; }
.rr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 62px; padding: 10px 16px; }
.rr + .rr { box-shadow: inset 0 1px 0 var(--sep); }
.rr-t { min-width: 0; }
.rr-t b { display: block; font-size: 15px; font-weight: 600; line-height: 1.25; color: var(--label); }
.rr-t span { display: block; margin-top: 2px; font-size: 13px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rr-v { font-family: var(--font-round); font-size: 14px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* the player card editor (a panel) */
.pe-name { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 50px; border-radius: 12px; background: var(--surface); }
.pe-name input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; color: var(--label); font: inherit; font-size: 17px; font-weight: 600; -webkit-user-select: text; user-select: text; }
.pe-name input:focus { outline: none; }
.pe-name span { font-size: 12px; color: var(--label-3); }
.pe-ems { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.pe-ems button { aspect-ratio: 1; border-radius: 14px; display: grid; place-items: center; background: var(--surface-2); color: var(--label-2); }
.pe-ems button svg { width: 26px; height: 26px; }
.pe-ems button[aria-pressed="true"] { background: var(--av, var(--accent)); color: var(--av-ink, #fff); }
.pe-titles { display: flex; flex-wrap: wrap; gap: 6px; }
.pe-titles button { height: 34px; padding: 0 12px; border-radius: 17px; background: var(--surface-2); font-size: 13px; font-weight: 600; color: var(--label); }
.pe-titles button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-hi); }
.pe-titles button[disabled] { color: var(--label-3); background: var(--surface); }
.pe-titles button[disabled] svg { width: 11px; height: 11px; margin-right: 4px; vertical-align: -1px; }
.pe-prev { display: flex; align-items: center; gap: 12px; margin: 2px 0 6px; }
.pe-prev .pav { width: 56px; height: 56px; border-radius: 28px; }
.pe-prev .pav svg { width: 30px; height: 30px; }


/* ---------- pause ---------- */
#pauseCard .pause-set { margin: 18px 0 14px; text-align: left; }
#pauseCard .btn + .btn { margin-top: 4px; height: 46px; font-size: 15px; }
#pauseCard .under.muted { margin-top: 0; }
#pauseCard .card-title { margin-bottom: 6px; }

@media (max-height: 720px) {
  .card { padding: 20px 16px 10px; }
  #checkpoint { padding-top: 0; }
  #checkpoint .kicker { margin: 0 -16px 16px; }
  .card-title { margin-bottom: 10px; }
  .big { font-size: 46px; }
  .tiles { margin: 14px 0 12px; padding: 10px 0 9px; }
  .gains { margin-bottom: 12px; }
  .stack { gap: 6px; }
  .next { margin: 14px 2px 12px; padding: 12px 2px 0; }
  .hero { margin: 10px 0 12px; }
  .tiers button { height: 54px; border-radius: 14px; } /* short phones: the arena keeps its share of the screen */
  .tiers .tx { font-size: 19px; }
  .bet { margin-top: 10px; padding: 5px 5px 7px; }
  .round { width: 42px; height: 42px; }
  .bet-input { font-size: 25px; height: 38px; }
  .win { margin: 8px 0 10px; }
  #callout .c1 { font-size: 38px; }
}
@media (max-width: 389px) { /* phones narrower than 390 px: a smaller large title, so "Challenges" clears the balance */
  .ltitle, .vtitle { font-size: 26px; }
  #lobby .ltitle { font-size: 28px; }
}
@media (max-width: 374px) { /* the odds table tightens, and "5+ streak" may take two lines, so the totals fit */
  .tbl { padding: 2px 8px; }
  .tbl table { font-size: 13px; }
  .tbl th { white-space: normal; }
}
@media (max-width: 359px) { /* small phones: a shorter title line, and the balance without its Demo tag */
  .ltitle, .vtitle, #lobby .ltitle { font-size: 23px; padding-right: 112px; }
  .hud-lobby .cap { padding: 0 12px; }
  .hud-lobby .cap .tag { display: none; }
  .tiers { gap: 6px; }
  .tiers .tn { font-size: 11.5px; }
  .tiers .tx { font-size: 17px; }
}
@media (max-height: 600px) {
  .ltitle, .vtitle, #lobby .ltitle { font-size: 25px; height: 36px; line-height: 36px; }
  .btn { height: 46px; }
  .tiers button { height: 50px; }
  .tiers .tx { font-size: 17px; }
  .tiles b { font-size: 19px; }
}
/* a tab's blocks rise in when you open it: played by riseIn() in game.js */
#fxLayer { position: fixed; inset: 0; z-index: 9; /* behind the cards: confetti bursts out from behind a card and never covers its text */ width: 100%; height: 100%; pointer-events: none; }
@media (prefers-reduced-motion: reduce) {
  .tiers button[aria-checked="true"] { animation: none; }
  .btn, .pill, .round, .tiers button, .cc-open, .pcard, .lk-info .li-a, #tabbar button::before { transition: none; }
  #fxLayer { display: none; }
  #prompt .ring::before, #prompt .ring::after { animation: none; }
  #prompt .ring::after { transform: scale(1); opacity: 0.45; }
  .streak.broke, .gain { animation: none; }
  #notice { transition: opacity 0.2s; transform: translate(-50%, 0); }
  .streak.broke { opacity: 0; }
  .sheet, .card, .panel, .view, #tabbar { transition: opacity 0.15s; }
  .view.page.hide { transform: none; }
}

/* ---------- edges: every panel on the black page has a hairline, so its shape is crisp without a glow ---------- */
.group, .cc, .tiles, .bests, .how, .tbl, .chap, .chlist, .runs, .menu-list, .pcard, .bet, .sp-card, .pot-me, .pot-demo, .empty, .tro, .vscroll .list, .pe-name, .lk-grid .item {
  border: 1px solid var(--hair);
}
.card .group, .card .tiles { border-color: rgba(255, 255, 255, 0.05); }

/* ---------- desktop ----------
   body.desk is set by game.js for a window at least 1024 x 600 (body.kb when there's a keyboard and mouse).
   The same three places as the tab bar, in a sidebar; the arena's window beside the bet; Challenges and Profile
   in two columns; pages in one reading column. A run keeps the phone's window onto the court, centred. */
.side-brand, #keys, .kc { display: none; }
.dk-col > .menu-list, .dk-col > .group + .menu-list, .dk-col > .pcard + .menu-list { margin-top: 22px; }
.dk-col:first-child > .cc:first-child { margin-top: 16px; }
body.desk {
  --side: 232px; --tab-h: 0px;
  --mpad: max(32px, calc((100vw - var(--side) - 1240px) / 2));   /* the main area's side padding: content is 1240 px at most */
  --pgpad: max(32px, calc((100vw - var(--side) - 680px) / 2));    /* a page's reading column: 680 px */
}
body.desk * { scrollbar-width: thin; scrollbar-color: #2a2438 transparent; }
/* the sidebar: the wordmark, then Play, Challenges and Profile; the picked one lights a segment at its edge */
body.desk #tabbar {
  left: 0; right: auto; top: 0; bottom: 0; width: var(--side); height: auto; padding: 22px 14px;
  display: flex; flex-direction: column; justify-content: flex-start; gap: 4px;
  background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.08);
}
body.desk .side-brand { display: block; margin: 0 10px 26px; height: 40px; font-family: var(--font-title); font-size: 25px; font-weight: 800; line-height: 40px; white-space: nowrap; color: var(--label); text-shadow: 0 2px 0 var(--accent); }
body.desk #tabbar button { flex: none; flex-direction: row; align-items: center; justify-content: flex-start; gap: 12px; height: 46px; padding: 0 14px; border-radius: 13px; font-size: 15px; font-weight: 600; letter-spacing: 0; color: var(--label-2); transition: color 0.15s, background 0.15s; }
body.desk #tabbar button::before { top: 50%; left: 0; width: 3px; height: 20px; margin: -10px 0 0; border-radius: 0 2px 2px 0; transform: scaleY(0); }
body.desk #tabbar button[aria-selected="true"]::before { transform: scaleY(1); }
body.desk #tabbar button[aria-selected="true"] { background: var(--surface); color: var(--label); }
body.desk #tabbar button[aria-selected="true"] svg { color: var(--accent-hi); }
body.desk #tabbar svg { width: 22px; height: 22px; }
body.desk #tabbar .badge { position: static; margin-left: auto; box-shadow: none; }
body.desk.hud-play #tabbar { transform: translateX(-100%); }
/* between runs the balance sits at the top right of the main area */
body.desk.hud-lobby #hud { left: var(--side); right: 0; width: auto; transform: none; padding: 22px var(--mpad) 0; }
/* Play and the Locker: the window on the left, what you set on the right */
body.desk .home {
  left: var(--side); right: 0; bottom: 0; width: auto; transform: none;
  display: grid; grid-template-columns: minmax(0, 1fr) clamp(360px, 27vw, 440px); column-gap: 28px; row-gap: 14px;
  padding: 22px var(--mpad) 28px;
}
body.desk .home.hide { transform: none; }
body.desk .home .hero { grid-column: 1; grid-row: 1 / -1; margin: 0; min-height: 0; }
body.desk #lobby { grid-template-rows: 40px minmax(0, 1fr); }
body.desk #lobby .ltitle { display: none; }
body.desk #lobby .controls { grid-column: 2; grid-row: 2; align-self: start; }
body.desk #vLocker { grid-template-rows: 40px auto auto minmax(0, 1fr); padding-bottom: 28px; }
body.desk #vLocker > :not(.hero) { grid-column: 2; }
body.desk .navrow { justify-content: flex-start; gap: 6px; }
body.desk .navrow .back { position: static; }
body.desk .lk-grid { height: auto; }
body.desk .lk-info { min-height: 62px; }
/* Challenges and Profile: two columns under the title */
body.desk .view { left: var(--side); }
body.desk .view::before { height: 72px; }
body.desk .vscroll { padding: 22px var(--mpad) 44px; }
body.desk .vcol { max-width: none; }
body.desk .dk-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 28px; align-items: start; }
body.desk .dk-col > :first-child { margin-top: 16px; }
/* pages: one reading column in the middle of the main area */
body.desk .view.page .vscroll { padding: 66px var(--pgpad) 44px; }
body.desk .pg-head { padding: 22px calc(var(--pgpad) - 8px) 0; }
/* the one sheet (the player card) is a dialog */
body.desk .panel { top: 50%; bottom: auto; max-height: min(760px, calc(100% - 64px)); padding-bottom: 0; border-radius: 22px; transform: translate(-50%, -50%); box-shadow: inset 0 0 0 1px var(--line), 0 24px 60px rgba(0, 0, 0, 0.6); }
body.desk .panel.hide { transform: translate(-50%, -47%) scale(0.97); }
body.desk .panel::before { display: none; }
/* with a keyboard: what the keys do, at the foot of the sidebar (and of the screen in a run), and on the buttons */
kbd { font-family: var(--font); }
#keys kbd, .kc { min-width: 24px; height: 21px; padding: 0 6px; border-radius: 6px; place-items: center; font-size: 11px; font-weight: 650; line-height: 1; }
body.desk.kb #keys { position: fixed; left: 26px; bottom: 24px; z-index: 12; display: grid; gap: 8px; pointer-events: none; font-size: 12.5px; color: var(--label-3); transition: opacity 0.3s; }
#keys > div { display: flex; align-items: center; gap: 10px; }
#keys kbd { display: inline-grid; min-width: 46px; background: var(--surface-2); color: var(--label-2); box-shadow: 0 2px 0 var(--key-edge); }
body.hud-lobby #keys .k-run, body.hud-play #keys .k-lobby { display: none; }
body.page-open #keys { opacity: 0; }
body.desk.kb .btn { position: relative; }
body.desk.kb .btn .kc { display: inline-grid; position: absolute; right: 12px; top: 50%; margin-top: -11px; background: rgba(0, 0, 0, 0.22); color: inherit; opacity: 0.85; }
body.desk.kb .btn-plain .kc { background: rgba(255, 255, 255, 0.08); }
body.desk.kb .actions .btn .kc { top: 8px; right: 8px; margin-top: 0; }   /* the checkpoint's two keys: in the corner, clear of the words */
