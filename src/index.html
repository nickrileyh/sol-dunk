<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SOL DUNK</title>
<style>/*@@STYLE@@*/</style>
</head>
<body class="hud-lobby">
<canvas id="game" aria-label="SOL DUNK playfield. Tap or press space to flap."></canvas>

<div id="hud">
  <div class="hud-left">
    <button class="cap glass icon play-only" id="pauseBtn" aria-label="Pause">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="3.6" height="14" rx="1.4"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.4"/></svg>
    </button>
  </div>
  <div class="hud-mid play-only" aria-live="polite">
    <span class="cap glass pot"><span class="sol-ico"></span><span id="hudPot">0.1000</span><span class="unit">SOL</span></span>
    <div class="lvl"><span id="hudLevel">Level 1</span><span class="segbar" id="pips" aria-hidden="true"></span></div>
  </div>
  <div class="hud-right">
    <button class="cap glass lobby-only" id="balBtn" aria-label="Balance and wallet"><span class="sol-ico"></span><span class="num" id="balTxt">10.00</span><span class="unit">SOL</span><span class="tag" id="balTag">Demo</span></button>
    <button class="cap glass icon" id="muteBtn" aria-label="Mute sound">
      <svg id="muteIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
    </button>
    <button class="cap glass icon lobby-only" id="menuBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
  </div>
</div>

<div id="prompt" aria-hidden="true"><div class="ring"></div><div class="t" id="promptText">Tap to fly</div><div class="s" id="promptSub"></div></div>
<div id="banner" aria-live="polite"><div class="b1" id="bannerT"></div><div class="b2" id="bannerS"></div></div>

<section id="lobby" class="sheet" aria-label="Place a bet">
  <h1 class="title"><span class="accent">SOL</span> DUNK</h1>
  <p class="subtitle">Tap to flap. Swish to multiply.</p>
  <div class="seg" role="radiogroup" aria-label="Difficulty" id="diffs"></div>
  <p class="foot" id="diffInfo"></p>
  <div class="group">
    <div class="row">
      <label class="k" for="betInput">Bet</label>
      <div class="stepper">
        <button id="betHalf" aria-label="Halve bet">½</button>
        <label class="bet-field"><input id="betInput" class="bet-input" type="text" inputmode="decimal" autocomplete="off" aria-label="Bet in SOL"><span class="unit">SOL</span></label>
        <button id="betDouble" aria-label="Double bet">2×</button>
      </div>
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <button class="btn btn-primary" id="playBtn">Play <span class="num" id="playAmt">0.1 SOL</span></button>
  <div class="err" id="lobbyErr" role="alert"></div>
  <nav class="links">
    <button data-panel="how">How to play</button>
    <button data-panel="odds">Odds</button>
    <button data-panel="stats">Stats</button>
    <button data-panel="fair">Fairness</button>
  </nav>
</section>

<section id="checkpoint" class="card hide" aria-label="Checkpoint">
  <div class="kicker" id="cpKicker">Checkpoint</div>
  <div class="card-title" id="cpTitle">Level 1 cleared</div>
  <div class="big"><span class="sol-ico"></span><span id="cpPot">0.0000</span><span class="unit">SOL</span></div>
  <div class="under" id="cpMult">1.00×</div>
  <div class="actions" style="margin-top:24px">
    <button class="btn btn-green" id="cashBtn">Cash out<small id="cashAmt">0 SOL</small></button>
    <button class="btn btn-go" id="goBtn">Keep going<small id="goSub">Level 2</small></button>
  </div>
</section>

<section id="result" class="card hide" aria-label="Run result">
  <div class="card-title" id="resTitle">Cashed out</div>
  <div class="big" id="resAmount"><span class="sol-ico"></span><span id="resNum">+0</span><span class="unit">SOL</span></div>
  <div class="under muted" id="resSub"></div>
  <div class="tiles" id="resStats"></div>
  <div class="stack">
    <button class="btn btn-primary" id="againBtn">Play again <span class="num" id="againAmt"></span></button>
    <button class="btn btn-plain" id="lobbyBtn">Change bet</button>
  </div>
</section>

<div class="scrim" id="scrim"></div>
<section id="panel" class="panel hide" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
  <header><h2 id="panelTitle">How to play</h2><button class="close" id="panelClose" aria-label="Close">✕</button></header>
  <div class="body" id="panelBody"></div>
</section>
<div id="toast" class="glass" role="status"></div>

<script>/*@@CONFIG@@*/</script>
<script>/*@@ENGINE@@*/</script>
<script>/*@@PAYTABLE@@*/</script>
<script>/*@@BOT@@*/</script>
<script>/*@@GAME@@*/</script>
</body>
</html>
