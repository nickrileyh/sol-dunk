<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SOL DUNK</title>
<style>/*@@STYLE@@*/</style>
</head>
<body class="hud-lobby">
<canvas id="game" aria-label="SOL DUNK playfield. Tap or press space to flap."></canvas>

<div id="hud">
  <div class="hud-left">
    <button class="cap glass icon play-only" id="pauseBtn" aria-label="Pause">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="3.6" height="14" rx="1.4"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.4"/></svg>
    </button>
    <div class="lvl play-only"><span id="hudLevel">Level 1</span><span class="segbar" id="pips" aria-hidden="true"></span></div>
    <div class="streak play-only" id="streak" aria-live="polite">
      <div class="stk-top">
        <svg class="flame" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 23c-4.4 0-8-3.1-8-7.5 0-3.3 2-5.6 3.7-7.4.6-.6 1.6-.2 1.6.7 0 1.4.9 2.6 2.1 2.6 1.1 0 1.8-.9 1.8-2.1 0-2.3-1.2-4.2-1.2-6.6 0-.9 1-1.5 1.7-1C17 3.9 20 8.4 20 14.5 20 19.6 16.4 23 12 23Z"/></svg>
        <b class="num" id="stkN">0</b><span id="stkT">Swish</span>
      </div>
      <div class="heat" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <small class="num" id="stkNext"></small>
    </div>
  </div>
  <div class="hud-mid play-only" aria-live="polite">
    <div class="score" id="hudMult">1.00×</div>
    <div class="pot" id="potCap"><span class="sol-ico"></span><span id="hudPot">0.1000</span><span class="unit">SOL</span></div>
    <span class="delta num" id="potDelta"></span>
  </div>
  <div class="hud-right">
    <button class="cap glass lobby-only" id="balBtn" aria-label="Balance and wallet"><span class="sol-ico"></span><span class="num" id="balTxt">10.00</span><span class="unit">SOL</span><span class="tag" id="balTag">Demo</span></button>
    <button class="cap glass icon play-only" id="muteBtn" aria-label="Mute sound">
      <svg id="muteIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
    </button>
  </div>
</div>

<div id="prompt" aria-hidden="true"><div class="ring"></div><div class="t" id="promptText">Tap to fly</div><div class="s" id="promptSub"></div></div>
<div id="banner" aria-live="polite"><div class="b1" id="bannerT"></div><div class="b2" id="bannerS"></div></div>
<div id="callout" aria-live="polite"><div class="c1" id="callT"></div><div class="c2" id="callS"></div></div>
<div id="notice" role="status" aria-live="polite"></div>

<section id="lobby" class="sheet home" aria-label="Place a bet">
  <h1 class="ltitle">SOL DUNK</h1>
  <div class="hero" id="hero" aria-hidden="true"></div>
  <div class="controls">
    <div class="tiers" role="radiogroup" aria-label="Difficulty" id="diffs"></div>
    <div class="foot-row">
      <p class="foot" id="diffInfo"></p>
      <button class="foot-link" data-page="odds" aria-label="Odds for this tier">Odds<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5.5 6.5 6.5L9 18.5"/></svg></button>
    </div>
    <div class="bet" role="group" aria-label="Bet">
      <button class="round" id="betDown" aria-label="Lower bet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button>
      <label class="bet-field"><input id="betInput" class="bet-input" type="text" inputmode="decimal" autocomplete="off" aria-label="Bet in SOL"><span class="unit">SOL</span></label>
      <button class="round" id="betUp" aria-label="Raise bet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg></button>
    </div>
    <p class="win" id="winLine"></p>
    <button class="btn btn-primary" id="playBtn">Play <span class="num" id="playAmt">0.1 SOL</span><kbd class="kc">Space</kbd></button>
    <button class="practice-link" id="practiceBtn">Practice for free</button>
    <div class="err" id="lobbyErr" role="alert"></div>
  </div>
</section>

<section id="vChallenges" class="view hide" aria-label="Challenges"><div class="vscroll" id="cBody"></div></section>
<section id="vProfile" class="view hide" aria-label="Profile"><div class="vscroll" id="pBody"></div></section>
<section id="vLocker" class="sheet home locker hide" aria-label="Locker">
  <div class="navrow"><button class="back" id="lkBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5.5 8.5 12l6.5 6.5"/></svg>Profile</button><h2 class="navtitle">Locker</h2></div>
  <div class="hero" id="lkHero" aria-hidden="true"></div>
  <div class="lk-cats" id="lkCats" role="tablist" aria-label="Item type"></div>
  <div class="lk-info" id="lkInfo" aria-live="polite"></div>
  <div class="lk-grid" id="lkGrid"></div>
</section>
<!-- a page pushed over the current tab (How to play, Odds & fairness, Wallet, Trophies, Recent runs) -->
<section id="vPage" class="view page hide" aria-labelledby="pgTitle">
  <div class="vscroll" id="pgBody"></div>
  <div class="pg-head"><button class="cap glass back" id="pgBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5.5 8.5 12l6.5 6.5"/></svg><span id="pgBackT">Back</span></button></div>
</section>

<nav id="tabbar" role="tablist" aria-label="Sections">
  <div class="side-brand" aria-hidden="true">SOL DUNK</div>
  <button role="tab" data-tab="play" id="tabPlay" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M3.6 12h16.8M12 3.4v17.2M6.1 5.9c2.4 1.6 3.4 3.8 3.4 6.1s-1 4.5-3.4 6.1M17.9 5.9c-2.4 1.6-3.4 3.8-3.4 6.1s1 4.5 3.4 6.1"/></svg><span>Play</span></button>
  <button role="tab" data-tab="challenges" id="tabChallenges" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.6 3.8h8.8v5.4a4.4 4.4 0 0 1-8.8 0z"/><path d="M7.6 5.6H4.8v1.2a3.3 3.3 0 0 0 3.1 3.3M16.4 5.6h2.8v1.2a3.3 3.3 0 0 1-3.1 3.3M12 13.6v3.6M8.4 20.2h7.2M9.8 20.2l.6-3h3.2l.6 3"/></svg><span>Challenges</span><i class="badge" id="badgeC"></i></button>
  <button role="tab" data-tab="profile" id="tabProfile" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.4" r="3.9"/><path d="M4.6 20.4c.8-3.9 3.7-6.1 7.4-6.1s6.6 2.2 7.4 6.1"/></svg><span>Profile</span><i class="badge" id="badgeP"></i></button>
</nav>

<section id="pauseCard" class="card hide" aria-label="Paused" tabindex="-1">
  <div class="card-title">Paused</div>
  <div class="under muted" id="pauseSub"></div>
  <div class="group pause-set">
    <div class="row"><span class="k">Sound</span><button class="switch" role="switch" id="pSound" data-set="sound" aria-label="Sound"></button></div>
    <div class="row"><span class="k">Vibration</span><button class="switch" role="switch" id="pHaptics" data-set="haptics" aria-label="Vibration"></button></div>
  </div>
  <button class="btn btn-primary" id="resumeBtn">Resume<kbd class="kc">Esc</kbd></button>
  <button class="btn btn-plain" data-page="how">How to play</button>
</section>

<section id="checkpoint" class="card hide" aria-label="Checkpoint" tabindex="-1">
  <div class="kicker" id="cpKicker">Checkpoint</div>
  <div class="card-title" id="cpTitle">Level 1 cleared</div>
  <div class="big"><span class="sol-ico"></span><span id="cpPot">0.0000</span><span class="unit">SOL</span></div>
  <div class="under" id="cpMult">1.00×</div>
  <div class="next" id="cpNext">
    <div class="nx-h"><span id="cpNextL">Next: Level 2</span><b class="num" id="cpUpTo"></b></div>
    <div class="nx-s" id="cpStreak"></div>
  </div>
  <div class="actions">
    <button class="btn btn-green" id="cashBtn">Cash out<small id="cashAmt">0 SOL</small><kbd class="kc">C</kbd></button>
    <button class="btn btn-plain" id="goBtn">Keep going<small id="goSub">Level 2</small><kbd class="kc">&#8629;</kbd></button>
  </div>
</section>

<section id="result" class="card hide" aria-label="Run result" tabindex="-1">
  <div class="card-title" id="resTitle">Cashed out</div>
  <div class="big" id="resAmount"><span class="sol-ico"></span><span id="resNum">+0</span><span class="unit">SOL</span></div>
  <div class="under muted" id="resSub"></div>
  <div class="tiles" id="resStats"></div>
  <div class="xp" id="resXp">
    <div class="xp-h"><span id="xpLvl">Level 1</span><span class="num" id="xpGain"></span></div>
    <div class="xp-bar"><i id="xpFill"></i></div>
  </div>
  <div class="gains" id="resGains"></div>
  <div class="stack">
    <button class="btn btn-primary" id="againBtn"><span id="againT">Play again</span> <span class="num" id="againAmt"></span><kbd class="kc">Space</kbd></button>
    <div class="pair">
      <button class="btn btn-plain" id="lobbyBtn">Change bet</button>
      <button class="btn btn-plain" id="shareBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8"/><path d="M5 12.5v6A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5v-6"/></svg>Share</button>
    </div>
  </div>
</section>

<!-- the quick tour: three steps for a first-time player -->
<section id="tour" class="card hide" role="dialog" aria-modal="true" aria-labelledby="tourTitle" tabindex="-1">
  <div class="tour-ic" id="tourIc" aria-hidden="true"></div>
  <div class="card-title" id="tourTitle"></div>
  <p class="tour-tx" id="tourText"></p>
  <div class="tour-dots" aria-hidden="true"><i></i><i></i><i></i></div>
  <button class="btn btn-plain" id="tourNext">Next</button>
  <button class="tour-skip" id="tourSkip">Skip</button>
</section>

<div class="scrim" id="scrim"></div>
<section id="panel" class="panel hide" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
  <header><h2 id="panelTitle">How to play</h2><button class="close" id="panelClose">Done</button></header>
  <div class="body" id="panelBody"></div>
</section>
<!-- desktop, with a keyboard: what the keys do -->
<div id="keys" aria-hidden="true">
  <div><kbd>Space</kbd><span class="k-lobby">Play</span><span class="k-run">Flap</span></div>
  <div class="k-run"><kbd>C</kbd><span>Cash out</span></div>
  <div class="k-run"><kbd>Enter</kbd><span>Keep going</span></div>
  <div><kbd>Esc</kbd><span class="k-lobby">Back</span><span class="k-run">Pause</span></div>
  <div><kbd>M</kbd><span>Sound</span></div>
</div>
<div id="toast" class="glass" role="status"></div>
<canvas id="fxLayer" aria-hidden="true"></canvas>

<script>/*@@CONFIG@@*/</script>
<script>/*@@ENGINE@@*/</script>
<script>/*@@PAYTABLE@@*/</script>
<script>/*@@BOT@@*/</script>
<script>/*@@POTS@@*/</script>
<script>/*@@MISSIONS@@*/</script>
<script>/*@@SPECIAL@@*/</script>
<script>/*@@GAME@@*/</script>
</body>
</html>
